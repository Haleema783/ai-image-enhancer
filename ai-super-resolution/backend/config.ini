# Configuration file for Real-ESRGAN backend
# Adjust these values to optimize performance for your use case

[Model]
# Model architecture
MODEL_NAME = RealESRGAN_x4plus
UPSCALE_FACTOR = 4
NUM_FEATURES = 64
NUM_BLOCKS = 23
NUM_GROW_CH = 32

[Processing]
# Tile size for memory-efficient processing
# Larger = faster but more memory
# Smaller = slower but less memory
TILE_SIZE = 400
TILE_PAD = 10
PRE_PAD = 0

[Performance]
# Use half precision (FP16) on GPU for faster inference
USE_HALF_PRECISION = True

# Preprocessing
[Preprocessing]
# Convert all images to RGB
FORCE_RGB = True

# Validate image dimensions
MIN_DIMENSION = 32
MAX_DIMENSION = 8192

[PostProcessing]
# Adaptive sharpening based on blur detection
ENABLE_ADAPTIVE_SHARPENING = True

# Blur detection threshold (Laplacian variance)
BLUR_THRESHOLD_VERY_BLURRY = 100
BLUR_THRESHOLD_MODERATELY_BLURRY = 300

# Sharpening strength for each category
SHARPEN_STRENGTH_VERY_BLURRY = 1.4
SHARPEN_STRENGTH_MODERATELY_BLURRY = 1.2
SHARPEN_STRENGTH_CLEAR = 1.0

# Output quality (1-100, higher = better quality, larger file size)
OUTPUT_QUALITY = 95

# Output format
OUTPUT_FORMAT = PNG

[API]
# Server configuration
HOST = 127.0.0.1
PORT = 5000
DEBUG = True

# Request limits
MAX_FILE_SIZE = 16777216  # 16MB in bytes
REQUEST_TIMEOUT = 300    # 5 minutes

[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
LOG_LEVEL = INFO

# Log file (leave empty to log to console only)
LOG_FILE = logs/backend.log

# Detailed model loading logs
VERBOSE_LOGGING = False

[Cache]
# Cache downloaded models
CACHE_MODELS = True
CACHE_DIR = models

# Auto cleanup old cache files
AUTO_CLEANUP = False
CACHE_MAX_AGE_DAYS = 30

[Device]
# Force device (auto, cpu, cuda)
DEVICE = auto

# Allow GPU fallback to CPU if OOM
GPU_FALLBACK = True

# Memory fraction to allocate (0.0-1.0)
GPU_MEMORY_FRACTION = 0.9

[FileHandling]
# Supported image formats
SUPPORTED_FORMATS = png,jpg,jpeg,gif,bmp

# Cleanup temporary files after processing
CLEANUP_TEMP_FILES = True

# Keep original file in uploads folder
KEEP_ORIGINAL = False
